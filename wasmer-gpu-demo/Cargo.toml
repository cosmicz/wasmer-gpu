[package]
name = "wasmer-gpu-demo"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "wasmer_gpu_demo"
path = "src/lib.rs"

[[bin]]
name = "gpu-smoke"
path = "src/main.rs"

[[bin]]
name = "gpu-mnist"
path = "src/bin/gpu-mnist.rs"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
wasmer = { git = "https://github.com/wasmerio/wasmer", rev = "6a844cff9bd2eb391ab91b7e41fee94260f0ec46", default-features = false, features = ["sys-default"] }
wasmer-wasix = { git = "https://github.com/wasmerio/wasmer", rev = "6a844cff9bd2eb391ab91b7e41fee94260f0ec46" }
wat = "1"
wgpu = "0.19"
